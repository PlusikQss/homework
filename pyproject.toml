[project]
name = "homework"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name", email = "you@example.com"}
]
requires-python = ">=3.14"

# Зависимости как строки — это сейчас единственный способ, который точно сработает
dependencies = [
    "pytest>=9.1.1,<10.0.0",
    "pandas (>=3.0.5,<4.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8>=7.3.0,<8.0.0",
    "black>=26.5.1,<27.0.0",
    "isort>=8.0.1,<9.0.0",
    "mypy>=2.3.0,<3.0.0"
]
dev = [
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "types-requests (>=2.33.0.20260906,<3.0.0.0)",
    "pandas-stubs (>=3.0.5.260730,<4.0.0.0)"
]

[tool.poetry]
packages = [{include = "src"}]

[tool.black]
line-length = 88
target-version = ['py311']


[tool.isort]
profile = "black"
# line-length не указываем — profile сам задаёт нужную длину

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true